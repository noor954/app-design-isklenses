name: Publish Android app

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'qaiserfccc' && github.triggering_actor == 'qaiserfccc'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$CERT_SHA256" || { echo "Android release signing secrets are required." >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/isk-release.jks"
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ISK_ANDROID_KEYSTORE: ${{ runner.temp }}/isk-release.jks
          ISK_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ISK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ISK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER" --dart-define=ISK_API_ORIGIN=https://www.isklenses.online
      - name: Verify signing certificate
        env:
          CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL=$(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" | cut -d: -f2- | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED" || { echo "APK signing certificate does not match the configured release certificate." >&2; exit 1; }
          cp "$APK" "$RUNNER_TEMP/isklenses.apk"
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest Android app" --notes "Latest signed ISK Lenses Android APK."
          fi
          gh release upload android-latest "$RUNNER_TEMP/isklenses.apk" --repo "$GITHUB_REPOSITORY" --clobber
